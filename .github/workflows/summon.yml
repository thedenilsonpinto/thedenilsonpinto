# Summon the Midnight AI Lab — rebuilds every SVG and the README when you edit the config block
# in README.md (or anything in forge/). Commits made by this workflow don't re-trigger it.
name: Summon the Midnight AI Lab

on:
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "forge/**"
      - "assets/backgrounds/**"
      - "!forge/.summon-state.json"
      - "!forge/README.generated.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: midnight-ai-lab-commits
  cancel-in-progress: false

jobs:
  summon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the forge
        run: pip install -r forge/requirements.txt

      - name: Rebuild assets + README from the config block
        run: python forge/summon.py

      - name: Validate (SVG safety, palette, README links, config)
        run: python forge/validate.py

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md forge
          if git diff --staged --quiet; then echo "Already up to date."; exit 0; fi
          git commit -m "summon: rebuild assets from the README config [skip ci]"
          git pull --rebase --autostash
          git push
